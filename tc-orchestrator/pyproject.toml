[project]
name = "tc-orchestrator"
version = "0.2.0"
description = "Engineering TC MCP Orchestrator + Brain tool-call loop"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "grpcio>=1.83.0,<2",
    "psycopg[binary]>=3.1",
    "protobuf>=7.35.1,<8",
]

[project.scripts]
tc-orchestrator = "tc_orchestrator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tc_orchestrator.proto_gen" = ["*.proto"]
"tc_orchestrator" = ["../../migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/tc_orchestrator/proto_gen",
    "src/tc_orchestrator/proto_gen/*.proto",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
