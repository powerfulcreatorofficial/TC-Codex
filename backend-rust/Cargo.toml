[package]
name = "tc-backend"
version = "0.2.0"
edition = "2021"
description = "Engineering TC Workspace Daemon (gRPC)"
license = "MIT"

[dependencies]
# gRPC server + protobuf
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
# hashing
sha2 = "0.10"
hex = "0.4"
# atomic writes
tempfile = "3"
# redaction patterns
regex = "1"
once_cell = "1"
# errors
anyhow = "1"
thiserror = "1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
